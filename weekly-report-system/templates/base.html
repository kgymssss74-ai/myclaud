<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}주간보고 시스템{% endblock %}</title>
  <script src="/static/vendor/alpine.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f5f6fa; color: #222; }
    header { background: #1a237e; color: #fff; padding: .6rem 1.2rem; display: flex; align-items: center; gap: 1rem; }
    header a { color: #90caf9; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    main { padding: 1rem 1.4rem; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 1.3rem; margin: .8rem 0; }
    h2 { font-size: 1.1rem; margin: .6rem 0; }
    label { display: block; font-size: .85rem; margin: .4rem 0 .15rem; font-weight: 600; }
    input[type=text], input[type=date], select, textarea {
      width: 100%; padding: .35rem .5rem; border: 1px solid #ccc; border-radius: 4px; font-size: .9rem; }
    textarea { resize: vertical; min-height: 64px; }
    .btn { padding: .4rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: .9rem; }
    .btn-primary { background: #1a237e; color: #fff; }
    .btn-primary:hover { background: #283593; }
    .btn-sm { padding: .2rem .6rem; font-size: .8rem; }
    .card { background: #fff; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .8rem; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border: 1px solid #ddd; padding: .3rem .5rem; text-align: left; }
    th { background: #e8eaf6; }
    .badge-risk { background: #ffcdd2; color: #b71c1c; padding: 1px 6px; border-radius: 3px; font-size: .75rem; }
    .badge-done { background: #c8e6c9; color: #1b5e20; padding: 1px 6px; border-radius: 3px; font-size: .75rem; }
    .badge-new  { background: #fff3e0; color: #e65100; padding: 1px 6px; border-radius: 3px; font-size: .75rem; }
    mark.delta  { background: #cce5ff; color: #00008b; }
    .readonly   { background: #fafafa; color: #555; }
    .split-left  { border-right: 2px solid #e0e0e0; padding-right: .8rem; }
    .error-box { background: #ffebee; border: 1px solid #ef9a9a; border-radius: 4px; padding: .5rem .8rem; color: #c62828; font-size: .85rem; }
    .success-box { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 4px; padding: .5rem .8rem; color: #2e7d32; font-size: .85rem; }
    [x-cloak] { display: none; }
  </style>
</head>
<body>
<header>
  <strong>주간보고 시스템</strong>
  <a href="/weekly">주간입력</a>
  <a href="/register">과제등록</a>
  <a href="/query">조회</a>
  <a href="/leader">파트장대시보드</a>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
