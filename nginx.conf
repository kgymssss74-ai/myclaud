server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # HTTP 요청을 HTTPS로 리다이렉트 (Cloudflare 사용 시 Flexible SSL이면 불필요할 수 있으나 Full(Strict) 권장)
    # return 301 https://$host$request_uri;
    
    # 프론트엔드 정적 파일 서빙 (만약 Nginx에서 직접 서빙할 경우)
    # 현재 FastAPI가 정적 파일을 서빙하고 있으므로, 모든 요청을 리버스 프록시로 넘깁니다.
    
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events)를 위한 설정 (FastAPI 검색 스트리밍용)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 필요하다면 API 경로만 따로 분리 가능
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 설정
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
